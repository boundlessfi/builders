    <linearGradient id="horizon" x1="600" y1="420" x2="600" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#2eedaa" stop-opacity="0"/><stop offset=".68" stop-color="#2eedaa" stop-opacity=".09"/><stop offset="1" stop-color="#2eedaa" stop-opacity=".02"/></linearGradient>
    <linearGradient id="mint-face" x1="775" y1="185" x2="1055" y2="465" gradientUnits="userSpaceOnUse"><stop stop-color="#eafdf7"/><stop offset=".38" stop-color="#73f3c6"/><stop offset="1" stop-color="#2eedaa"/></linearGradient>
    <linearGradient id="block-top" x1="0" y1="0" x2="110" y2="68" gradientUnits="userSpaceOnUse"><stop stop-color="#bef9e5"/><stop offset="1" stop-color="#2eedaa"/></linearGradient>
