<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Boundless Builders background artwork</title>
  <desc id="description">The Boundless mark rises from connected building blocks and stars above a dark teal horizon, with open space for text on the left.</desc>
